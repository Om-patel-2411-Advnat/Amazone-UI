<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazone.in-UI</title>
    <link rel="stylesheet" href="./output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
</head>
<body class="bg-gray-200">
    <header>
        <div class="bg-[#131921] text-white h-42 sm:h-28 lg:h-16 grid grid-cols-4 grid-rows-3 sm:grid-cols-5 sm:grid-rows-2 lg:grid-cols-30 lg:grid-rows-1 font-[arial]">
            
            <div class="grid-start-1 col-span-2 sm:grid-start-1 sm:col-span-1 lg:col-start-1 lg:col-span-2 hover-border m-1">
                <div class="h-[65%] w-[65%] flex items-center pt-5 px-3 sm:h-[75%] sm:w-[75%] lg:h-[85%] lg:w-[85%] lg:px-0">
                    <img src="../images/amazone_logo-1.png">
                    <p class="pb-1.5 pl-0.5">.in</p>
                </div>
            </div>
            <div class="grid-start-3 col-span-2 sm:grid-start-2 sm:col-span-1 lg:col-start-3 lg:col-span-3 hover-border m-1 mx-4">
                <div class="flex pt-2">
                    <div class="h-8 w-8 pt-2">
                        <img src="../images/Location_logo-1.svg" class="brightness-0 invert">
                    </div>
                    <div class="flex flex-col gap-0">
                        <p class="text-stone-400 text-sm sm:text-xs lg:">Deliver to <span class="lg:hidden">Om</span></p>
                        <p class="text-base font-bold sm:text-sm">Modasa 383315</p>
                    </div>
                </div>
            </div>
            <div class="grid-start-1 col-span-4 sm:grid-start-3 sm:row-start-2 sm:col-span-4 lg:col-start-6 lg:row-start-1 lg:col-span-16">
                <div class="h-full w-full flex items-center">
                    <div class="bg-gray-300 h-11 w-13 flex items-center justify-center rounded-l-md text-stone-500 gap-2 text-sm hover:bg-gray-400 hover:text-black">All <i class="fa-solid fa-caret-down"></i></div>
                    <div class="bg-white text-stone-400  h-11 w-160 xl:w-220 flex items-center pl-2 shrink"> <input type="search" placeholder="Search Amazone.in"> </div>
                    <div class="bg-amber-400 h-11 w-13 flex items-center justify-center text-xl rounded-r-md text-stone-600 hover:bg-amber-500 hover:text-black"><i class="fa-solid fa-magnifying-glass"></i></div>
                </div>
            </div>
            <div class="lg:col-span-2 my-2">
                <div class=" h-full w-full flex items-end justify-center gap-1">
                    <div class="h-full w-full flex items-end gap-0.5 hover-border pr-0.5 pb-1.5">
                        <img src="../images/india-icon.png" class="h-7 w-8">
                        <p class="text-sm font-bold">EN</p>
                    </div>
                    <p class="pb-1 mr-15 sm:mr-25 lg:mr-2 text-stone-400"><i class="fa-solid fa-caret-down"></i></p>
                </div>
            </div>
            <div class="lg:col-span-3">
                <div class="h-full w-full flex items-center justify-center gap-2 ">
                    <div class="flex flex-col hover-border py-1.5 px-1">
                        <p class="text-xs text-stone-400">Hello Om</p>
                        <p class="text-base font-bold">Accounts & Lists</p>
                    </div>
                    <p class=" text-stone-400 pt-2"><i class="fa-solid fa-caret-down"></i></p>
                </div>
            </div>
            <div class="lg:col-span-2 py-1">
                <div class="h-full w-full flex flex-col items-center justify-center hover-border">
                    <p class="text-xs text-stone-400">Returns</p>
                    <p class="text-base font-bold">& Orders</p>
                </div>
            </div>
            <div class="lg:col-span-2 py-1">
                <div class="h-full w-full flex items-center justify-center hover-border gap-2">
                    <p class="text-2xl"><i class="fa-solid fa-cart-arrow-down"></i></p>
                    <p class="text-base font-bold">Cart</p>
                </div>
            </div>
            
        </div>
    </header>
    <nav>
        <div class="bg-[#242b35] h-10 w-full flex justify-between">
            <div class="h-full w-20 text-white">
                <div class="h-full w-full flex justify-center items-center gap-1.5 hover-border">
                    <p><i class="fa-solid fa-bars"></i></p>
                    <p class="font-bold">All</p>
                </div>
            </div>
            <div class="h-full w-full">
                <ul class="h-full w-full flex items-center justify-start text-white gap-5">
                    <li class="hover-border hidden xl:block">Home  </li>
                    <li class="hover-border hidden 2xl:block">Mx Player</li>
                    <li class="hover-border hidden 3xl:block">sell</li>
                    <li class="hover-border hidden 4xl:bloxk">Gift cards</li>
                    <li class="hover-border hidden 5xl:block">Prime</li>
                    <li class="hover-border hidden 6xl:block">Buy Again</li>
                    <li class="hover-border hidden 7xl:block">History</li>
                    <li class="hover-border hidden 8xl:block">Books</li>
                    <li class="hover-border hidden 9xl:bloxk">T-shirts</li>
                    <li class="hover-border hidden 10xl:block">Shoes</li>
                    <li class="hover-border hidden 11xl:block">Best sellers</li>
                </ul>
            </div>
            <div class="h-full w-90">
                <div class="h-full w-full flex justify-end items-center">
                    <img src="../images/live_sale.jpg" class="lg:h-full lg:w-full">
                </div>
            </div>
        </div>
    </nav>
    <main>
        <section class="px-5">
            <div class="carousel relative overflow-hidden">
                <div class="carouselTrack flex transition-transform duration-600 ease-in-out">
                    <div class="min-w-full">
                        <img src="../images/hero-1.jpg" class="h-full w-full">
                    </div>
                    <div class="min-w-full">
                        <img src="../images/hero-2.jpg" class="h-full w-full">
                    </div>
                    <div class="min-w-full">
                        <img src="../images/hero-3.jpg" class="h-full w-full">
                    </div>
                    <div class="min-w-full">
                        <img src="../images/hero-4.jpg" class="h-full w-full">
                    </div>
                    <div class="min-w-full">
                        <img src="../images/hero-5.jpg" class="h-full w-full">
                    </div>
                    <div class="min-w-full">
                        <img src="../images/hero-6.jpg" class="h-full w-full">
                    </div>
                </div>
                <button class="back absolute top-[15%] left-5 text-black cursor-pointer z-5">
                    <div class="h-30 w-10 flex ">
                        <img src="../images/left-corosol.svg" >
                    </div>
                </button>
                <button class="next absolute top-[15%] right-5 text-black cursor-pointer z-5">
                    <div class="h-30 w-10 flex">
                        <img src="../images/right-corosol.svg">
                    </div>
                </button>
                <div class="absolute bottom-0 h-1/2 w-full bg-gradient-to-b from-transparent via-gray-200/50 to-gray-200 z-2"></div>
            </div>

            <!-- grid section -->
            <section class="absolute top-[50%] overflow-hidden h-full w-auto mx-5 bg-white z-30">
                <div class="w-full grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 ">
                    <div class="h-full w-full bg-amber-500">

                    </div>
                    <div class="h-full w-full bg-red-500">

                    </div>
                    <div class="h-full w-full bg-blue-500">

                    </div>
                    <div class="h-full w-full bg-green-500">

                    </div>
                </div>
            </section>
        </section>

    </main>


    <script src="../script.js"></script>
</body>
</html>
